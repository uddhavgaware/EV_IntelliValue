services:
  # ── Streamlit Backend (Web Service) ──────────────────────────────
  - type: web
    name: ev-intellivalue-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false
      - key: STREAMLIT_SERVER_HEADLESS
        value: true

  # ── Frontend Static Site ──────────────────────────────────────────
  - type: web
    name: ev-intellivalue-frontend
    runtime: static
    staticPublishPath: ./frontend
    buildCommand: ""           # No build needed for plain HTML/CSS/JS
    envVars:
      - key: APP_URL
        value: https://ev-intellivalue-app.onrender.com   # Streamlit app URL
